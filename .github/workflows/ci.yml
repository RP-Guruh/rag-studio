name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test pure packages
        run: go test ./internal/auth ./internal/chat ./internal/embedding ./internal/projects ./internal/settings ./internal/training
      - name: Type-check Wails service via cross-compile
        env:
          GOOS: windows
          CGO_ENABLED: '0'
        run: go build -o /tmp/rag-test.exe .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
