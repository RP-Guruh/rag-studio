name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          go build -tags production,purego,gtk3 -trimpath \
            -ldflags="-s -w -X rag_project/internal/update.Version=${VERSION}" \
            -o dist/rag-studio .

      - name: Package
        env:
          NAME: rag-studio-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          mkdir -p release
          cp README.md dist/
          mkdir -p dist/deploy/local
          cp deploy/local/docker-compose.yml dist/deploy/local/ 2>/dev/null || true
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && zip -qr "../release/${NAME}.zip" .)
          else
            tar -czf "release/${NAME}.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*

  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -tags production,purego,gtk3 -trimpath \
            -ldflags="-s -w -X rag_project/internal/update.Version=${VERSION}" \
            -o dist/rag-studio .
      - name: Install signing tools
        run: |
          sudo apt-get install -y libconfig-file-perl
          curl -fsSL -o /tmp/dpkg-sig.deb \
            https://deb.debian.org/debian/pool/main/d/dpkg-sig/dpkg-sig_0.13.1+nmu4_all.deb
          sudo dpkg -i /tmp/dpkg-sig.deb || sudo apt-get -f install -y
      - name: Build .deb
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash deploy/linux/build-deb.sh dist/rag-studio "${{ github.ref_name }}" "${{ matrix.arch }}" release
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.deb.asc
            release/*.gpg.key

  windows-installer:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build executable
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -tags production -trimpath `
            -ldflags="-s -w -X rag_project/internal/update.Version=${env:VERSION}" `
            -o dist/rag-studio.exe .
      - name: Sign executable
        if: env.WINDOWS_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("release\rag-studio.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          & $signtool sign /f release\rag-studio.pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\rag-studio.exe
      - name: Build installer with Inno Setup
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /dAppVersion=$version deploy\windows\installer.iss
      - name: Sign installer
        if: env.WINDOWS_PFX_BASE64 != ''
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          Get-ChildItem release\*.exe | ForEach-Object {
            & $signtool sign /f release\rag-studio.pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  release:
    needs: [build, deb, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          overwrite_files: true
          body: |
            Verify downloads with:
            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```
            Debian/Ubuntu (.deb) packages are GPG-signed when the release key is
            configured. Import `rag-studio-release.gpg.key` and verify either way:
            ```
            dpkg-sig --verify rag-studio_*.deb
            gpg --verify rag-studio_*.deb.asc rag-studio_*.deb
            ```
            The Windows installer is Authenticode-signed when a code-signing
            certificate is configured.
